[package]
name = "calendario-api"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vercel_runtime = "1"

[[bin]]
name = "ics"
path = "api/ics.rs"

[[bin]]
name = "stats"
path = "api/stats.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
